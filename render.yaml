# Render Blueprint — Web Service (backend root directory)
services:
  - type: web
    name: dynoquery-api
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: DATABASELOCALURL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PYTHON_API_URL
        value: https://dynopythonbackend.onrender.com/api/WebsiteDataFetcherApiByHuzaifa
      - key: INTERNAL_SECRET_KEY
        sync: false
